<svg width="1000" height="90" viewBox="0 0 1000 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bgGradF" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0d1a2b"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="90" fill="url(#bgGradF)"/>

  <line x1="0" y1="18" x2="1000" y2="18" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <g font-family="Consolas, 'Courier New', monospace" fill="#7dfaff" filter="url(#glowF)">
    <circle cx="60" cy="45" r="4" fill="#ffb454">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="78" y="50" font-size="13" fill="#ffb454" opacity="0.9">STANDBY MODE</text>

    <text x="500" y="50" font-size="13" text-anchor="middle" fill="#7dfaff">THANK YOU FOR VISITING, HUMAN.</text>

    <text x="940" y="50" font-size="12" text-anchor="end" fill="#00e5ff" opacity="0.85">LAST SYNC: JUL.2026</text>
  </g>

  <line x1="0" y1="72" x2="1000" y2="72" stroke="url(#lineGrad)" stroke-width="1"/>
</svg>
